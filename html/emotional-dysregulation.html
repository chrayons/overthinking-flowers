<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Dysregulation - Metaphor Garden</title>
  <link rel="preload" href="../Junicode/Junicode-RegularCondensed.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" as="style" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="category-page">
  <div class="wrapper">
    <a href="index.html" class="header-link">METAPHOR GARDEN</a>
    <div class="header-label">OVERTHINKING ZINE</div>

    <!-- Mobile Header Dropdown (shows on very small screens) -->
    <div class="mobile-header-dropdown">
      <button class="mobile-header-toggle" aria-label="Menu" aria-expanded="false">
        <div class="menu-icon-inner">
          <span></span>
          <span></span>
        </div>
      </button>
      <nav class="mobile-header-menu">
        <a href="index.html" class="mobile-header-menu-item">METAPHOR GARDEN</a>
        <span class="mobile-header-menu-item secondary">OVERTHINKING ZINE</span>
      </nav>
    </div>

    <div class="category-page-content">
      <div id="flower-container"></div>
      <div class="category-title-container">
        <h2 class="category-title">Emotional<br>Dysregulation</h2>
      </div>
    </div>

    <!-- Mobile layout matching home page structure EXACTLY -->
    <section id="themes-mobile" style="display: none; pointer-events: none;">
      <h2 class="eyebrow" style="opacity: 0; pointer-events: none;">EXPLORE BY THEME</h2>
      <div class="mobile-carousel">
        <div class="carousel-container">
          <div class="carousel-track" id="mobile-category-track">
            <div class="mobile-category-item active">
              <div class="category-label">Emotional<br>Dysregulation</div>
            </div>
          </div>
        </div>

        <div class="carousel-arrows" style="opacity: 0; pointer-events: none;">
          <button class="carousel-arrow carousel-prev" aria-label="Previous category">
            <img src="../arrow-left.svg" alt="Previous" width="23" height="23">
          </button>
          <div class="carousel-dots" id="carousel-dots">
            <div class="dot active"></div>
          </div>
          <button class="carousel-arrow carousel-next" aria-label="Next category">
            <img src="../arrow-right.svg" alt="Next" width="23" height="23">
          </button>
        </div>

        <a href="index.html" class="btn-mobile-blue btn-return-home-white">Return to Home</a>
      </div>
    </section>

    <section id="reflections" style="display: none;">
      <h2>REFLECTIONS</h2>
      <div id="shuffle-cards"></div>
      <button id="shuffle-btn" class="btn-primary">Shuffle Thoughts</button>
    </section>

    <!-- Critical scripts (needed for initial render) -->
    <script defer src="../scripts/shared.js"></script>
    <script defer src="../scripts/flower-renderer.js"></script>
    <script defer src="../scripts/flower-interactions.js"></script>
    <script defer src="../scripts/emotional-dysregulation.js"></script>

    <!-- Non-critical scripts (can load after page renders) -->
    <script async src="../scripts/modal.js"></script>
    <script async src="../scripts/mobile-header.js"></script>
  </div>
</body>
</html>
