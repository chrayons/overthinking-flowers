<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaphor Garden</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrapper">
    <h1>METAPHOR GARDEN</h1>

    <section id="themes-desktop">
      <h2 class="eyebrow">EXPLORE BY THEME</h2>
      <div id="category-grid"></div>
    </section>
    
    <!-- Enhanced Mobile carousel UI -->
<section id="themes-mobile">
  <h2 class="eyebrow">EXPLORE BY THEME</h2>
  <div class="mobile-carousel">
    <div class="carousel-container">
      <div class="carousel-track" id="mobile-category-track">
        <!-- Categories will be populated by JavaScript -->
      </div>
    </div>
    
    <div class="carousel-arrows">
      <button class="carousel-arrow carousel-prev" aria-label="Previous category">‹</button>
      <div class="carousel-dots" id="carousel-dots">
        <!-- Dots will be populated by JavaScript -->
      </div>
      <button class="carousel-arrow carousel-next" aria-label="Next category">›</button>
    </div>

    <button class="btn-mobile-blue" id="mobile-see-reflections-btn">See Reflections</button>
  </div>
</section>

<section id="reflections">
  <h2>REFLECTIONS</h2>
  <div id="shuffle-cards"></div>
  <button id="shuffle-btn" class="btn-primary">Shuffle Thoughts</button>
</section>
</div>

  <!-- scripts -->
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/flower-renderer.js"></script>
  <script src="../scripts/modal.js"></script>
  <script src="../scripts/shuffle.js"></script>
  <script src="../scripts/home.js"></script>
</body>
</html>
