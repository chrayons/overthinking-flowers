<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaphor Garden</title>
  <!-- Critical font preloading for immediate render -->
  <link rel="preload" as="font" href="../Satoshi/WEB/fonts/Satoshi-Light.woff2" type="font/woff2" crossorigin>
  <link rel="preload" as="font" href="../Satoshi/WEB/fonts/Satoshi-Italic.woff2" type="font/woff2" crossorigin>

  <!-- Critical CSS for immediate LCP rendering -->
  <style>
    /* Inline critical category grid CSS for faster LCP */
    #category-grid {
      display: grid;
      grid-template-columns: repeat(4, 288px);
      column-gap: clamp(40px, 6vw, 90px);
      row-gap: clamp(40px, 5vh, 72px);
      justify-content: center;
      justify-items: center;
      margin: 40px auto;
      max-width: 1400px;
    }

    .category-cell {
      position: relative;
      width: 288px;
      height: 198px;
      overflow: visible;
    }

    .category-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: "Satoshi-Light", system-ui;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
      line-height: 1.2;
      color: #101720;
      z-index: 2;
      cursor: pointer;
    }

    /* Mobile responsive for critical CSS */
    @media (max-width: 1160px) {
      #category-grid {
        grid-template-columns: repeat(2, 288px);
        column-gap: clamp(12px, 2vw, 20px);
        row-gap: clamp(40px, 5vh, 72px);
      }
    }

    @media (max-width: 775px) {
      #themes-desktop { display: none; }
    }

    /* Loading spinner for immediate user feedback */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #F8F8FF;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .loader {
      width: 36px; /* Smaller size */
      aspect-ratio: 1;
      border-radius: 50%;
      border: 4px solid; /* Thinner border */
      border-color: #005BA6 #005BA600; /* Blue with transparent */
      animation: variableSpin 2s ease-in-out infinite;
    }

    @keyframes variableSpin {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(45deg); } /* Slow start */
      50% { transform: rotate(180deg); } /* Speed up */
      75% { transform: rotate(300deg); } /* Fast section */
      100% { transform: rotate(360deg); } /* Complete rotation */
    }

    .page-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
      .page-loader {
        transition: none;
      }
    }
  </style>

  <link rel="preload" as="style" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../information-tooltip.css">
</head>
<body>
  <!-- Loading spinner for immediate user feedback -->
  <div class="page-loader">
    <div class="loader"></div>
  </div>

  <div class="wrapper">
    <a href="index.html" class="header-link">METAPHOR GARDEN</a>
    <div class="header-label">OVERTHINKING ZINE</div>

    <!-- Mobile Header Dropdown (shows on very small screens) -->
    <div class="mobile-header-dropdown">
      <button class="mobile-header-toggle" aria-label="Menu" aria-expanded="false">
        <div class="menu-icon-inner">
          <span></span>
          <span></span>
        </div>
      </button>
      <nav class="mobile-header-menu">
        <a href="index.html" class="mobile-header-menu-item">METAPHOR GARDEN</a>
        <span class="mobile-header-menu-item secondary">OVERTHINKING ZINE</span>
      </nav>
    </div>

    <section id="themes-desktop">
      <h2 class="eyebrow">EXPLORE BY THEME
        <button type="button" class="info-tip-trigger" aria-label="More info about exploring by theme" data-tip-text="Click into a theme to see reflections about overthinking">
          <span class="sr-only">More info about exploring by theme</span>
        </button>
      </h2>
      <div id="category-grid">
        <!-- Pre-rendered category labels for immediate LCP -->
        <div class="category-cell" data-category="Perpetual Looping">
          <div class="category-label">Perpetual<br>Looping</div>
        </div>
        <div class="category-cell" data-category="Loss of Agency">
          <div class="category-label">Loss of<br>Agency</div>
        </div>
        <div class="category-cell" data-category="Sensory Overwhelm">
          <div class="category-label">Sensory<br>Overwhelm</div>
        </div>
        <div class="category-cell" data-category="Emotional Dysregulation">
          <div class="category-label">Emotional<br>Dysregulation</div>
        </div>
        <div class="category-cell" data-category="Perceptual Barriers">
          <div class="category-label">Perceptual<br>Barriers</div>
        </div>
        <div class="category-cell" data-category="Thought Entanglement">
          <div class="category-label">Thought<br>Entanglement</div>

        <div class="category-cell" data-category="Temporal Disconnection">

    <!-- Enhanced Mobile carousel UI -->
<section id="themes-mobile">
  <h2 class="eyebrow">EXPLORE BY THEME
    <button type="button" class="info-tip-trigger" aria-label="More info about exploring by theme" data-tip-text="Click into a theme to see reflections about overthinking">

<section id="reflections">

  </div>

</section>
</div>


  <!-- Critical scripts (loaded after LCP for better performance) -->
  <script>
    // Loading management with fallback
    let loaderHidden = false;
    let contentReady = false;

    function hideLoader() {
      if (loaderHidden) return;
      loaderHidden = true;

      const loader = document.querySelector('.page-loader');
      if (loader) {
        loader.classList.add('fade-out');
        // Remove from DOM after transition
        setTimeout(() => {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Fallback: hide loader after 5 seconds maximum (extended for full content loading)
    setTimeout(hideLoader, 5000);

    // Hide loader when fonts are loaded and content is visually ready
    function checkAndHideLoader() {
      if (contentReady && document.fonts.ready) {
        document.fonts.ready.then(() => {
          // Wait for structural content to be ready, then trigger flower animations
          setTimeout(() => {
            // Check if structural content is ready
            const categoryGrid = document.getElementById('category-grid');
            const shuffleCards = document.getElementById('shuffle-cards');

            // Wait for basic content structure to be populated
            if (categoryGrid && categoryGrid.children.length > 0 &&
                shuffleCards && shuffleCards.children.length > 0) {

              // Hide loader and then trigger flower animations
              hideLoader();

              // Tooltips already initialized on DOMContentLoaded

              // Trigger flower animations after a brief delay
              setTimeout(() => {
                if (window.triggerFlowerAnimations) {
                  window.triggerFlowerAnimations();
                }
              }, 200);

            } else {
              // If content isn't ready yet, check again in a bit
              setTimeout(checkAndHideLoader, 200);
            }
          }, 300);
        });
      }
    }

    // Load critical scripts immediately but track when they're ready
    const scripts = [
      '../scripts/shared.js',
      '../scripts/flower-renderer.js',
      '../scripts/home.js',
      '../scripts/shuffle.js'
    ];

    let loadedScripts = 0;
    scripts.forEach((src) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => {
        loadedScripts++;
        // When all critical scripts are loaded, mark content as ready
        if (loadedScripts === scripts.length) {
          contentReady = true;
          // Tooltips already initialized separately
          checkAndHideLoader();
        }
      };
      document.head.appendChild(script);
    });

    // Also hide on DOMContentLoaded if scripts fail to load
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!loaderHidden) {
          contentReady = true;
          checkAndHideLoader();
        }
      }, 2500); // Extended to allow more time for content loading
    });
  </script>

  <!-- Non-critical scripts (can load after page renders) -->
  <script async src="../scripts/modal.js"></script>
  <script async src="../scripts/mobile-header.js"></script>

  <!-- Information tooltip system -->
  <script type="module">
    import { InformationTooltip, createInfoTipSVG } from '../scripts/information-tooltip.js';

    // Expose globally for use anywhere
    window.InformationTooltip = InformationTooltip;
    window.InformationTooltip.createInfoTipSVG = createInfoTipSVG;

    // Simple tooltip initialization - run once when module loads
    console.log('Initializing tooltips...');

    // Initialize tooltip system
    window._infoTips = InformationTooltip.init({
      triggerSelector: '.info-tip-trigger',
      mobileWidthEl: null, // Let CSS handle width constraints
      offset: 4,
      breakpoint: 1160
    });

    // Set up tooltips for existing buttons
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.info-tip-trigger[data-tip-text]').forEach(button => {
        const content = button.getAttribute('data-tip-text');
        if (content) {
          console.log('Setting up tooltip for button:', content);
          // Add SVG icon if not already there
          if (!button.innerHTML.includes('svg')) {
            button.innerHTML = createInfoTipSVG() + button.innerHTML;
          }

          // Create tooltip element manually and use the existing instance
          const tooltipId = `tooltip-${Math.random().toString(36).substr(2, 9)}`;
          const tooltip = document.createElement('div');
          tooltip.id = tooltipId;
          tooltip.className = 'information-tooltip';
          tooltip.setAttribute('role', 'tooltip');
          tooltip.innerHTML = `
            ${content}
            <span class="information-tooltip__arrow" aria-hidden="true"></span>
          `;

          // Append to body
          document.body.appendChild(tooltip);

          // Set aria relationship
          button.setAttribute('aria-describedby', tooltipId);

          // Use the existing instance to bind events
          window._infoTips.bindSingleTrigger(button);

          console.log('Tooltip created with ID:', tooltipId);
          console.log('Button aria-describedby:', button.getAttribute('aria-describedby'));
        }
      });
    });
  </script>
</body>
</html>
