<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaphor Garden</title>
  <link rel="preload" href="../Junicode/junicode-regularcondensed-webfont.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="style" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../Satoshi/WEB/css/satoshi.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../information-tooltip.css">
</head>
<body>
  <div class="wrapper">
    <a href="index.html" class="header-link">METAPHOR GARDEN</a>
    <div class="header-label">OVERTHINKING ZINE</div>

    <!-- Mobile Header Dropdown (shows on very small screens) -->
    <div class="mobile-header-dropdown">
      <button class="mobile-header-toggle" aria-label="Menu" aria-expanded="false">
        <div class="menu-icon-inner">
          <span></span>
          <span></span>
        </div>
      </button>
      <nav class="mobile-header-menu">
        <a href="index.html" class="mobile-header-menu-item">METAPHOR GARDEN</a>
        <span class="mobile-header-menu-item secondary">OVERTHINKING ZINE</span>
      </nav>
    </div>

    <section id="themes-desktop">
      <h2 class="eyebrow">EXPLORE BY THEME
        <button type="button" class="info-tip-trigger" aria-describedby="tip-themes" aria-label="More info about exploring by theme">
          <svg width="33" height="33" viewBox="0 0 33 33" fill="none" aria-hidden="true">
            <g clip-path="url(#clip0_923_2720_themes)">
              <path d="M17.235 19.1439V16.7687M17.235 14.3934H17.2409M23.1731 16.7687C23.1731 20.0482 20.5145 22.7068 17.235 22.7068C13.9555 22.7068 11.2969 20.0482 11.2969 16.7687C11.2969 13.4892 13.9555 10.8306 17.235 10.8306C20.5145 10.8306 23.1731 13.4892 23.1731 16.7687Z" stroke="#AFBCC7" stroke-width="1.04762" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <defs>
              <clipPath id="clip0_923_2720_themes">
                <rect width="14.2515" height="14.2515" fill="white" transform="translate(10.1094 9.64282)"/>
              </clipPath>
            </defs>
          </svg>
          <span class="sr-only">More info about exploring by theme</span>
        </button>
      </h2>
      <div id="category-grid"></div>
    </section>
    
    <!-- Enhanced Mobile carousel UI -->
<section id="themes-mobile">
  <h2 class="eyebrow">EXPLORE BY THEME
    <button type="button" class="info-tip-trigger" aria-describedby="tip-themes-mobile" aria-label="More info about exploring by theme">
      <svg width="33" height="33" viewBox="0 0 33 33" fill="none" aria-hidden="true">
        <g clip-path="url(#clip0_923_2720_themes_mobile)">
          <path d="M17.235 19.1439V16.7687M17.235 14.3934H17.2409M23.1731 16.7687C23.1731 20.0482 20.5145 22.7068 17.235 22.7068C13.9555 22.7068 11.2969 20.0482 11.2969 16.7687C11.2969 13.4892 13.9555 10.8306 17.235 10.8306C20.5145 10.8306 23.1731 13.4892 23.1731 16.7687Z" stroke="#AFBCC7" stroke-width="1.04762" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <defs>
          <clipPath id="clip0_923_2720_themes_mobile">
            <rect width="14.2515" height="14.2515" fill="white" transform="translate(10.1094 9.64282)"/>
          </clipPath>
        </defs>
      </svg>
      <span class="sr-only">More info about exploring by theme</span>
    </button>
  </h2>
  <div class="mobile-carousel">
    <div class="carousel-container">
      <div class="carousel-track" id="mobile-category-track">
        <!-- Categories will be populated by JavaScript -->
      </div>
    </div>
    
    <div class="carousel-arrows">
      <button class="carousel-arrow carousel-prev" aria-label="Previous category">
        <img src="../arrow-left.svg" alt="Previous" width="23" height="23">
      </button>
      <div class="carousel-dots" id="carousel-dots">
        <!-- Dots will be populated by JavaScript -->
      </div>
      <button class="carousel-arrow carousel-next" aria-label="Next category">
        <img src="../arrow-right.svg" alt="Next" width="23" height="23">
      </button>
    </div>

    <button class="btn-mobile-blue" id="mobile-see-reflections-btn">See Reflections</button>
  </div>
</section>

<section id="reflections">
  <h2>REFLECTIONS</h2>
  <div id="shuffle-cards">
    <!-- Pre-rendered content for fast LCP -->
    <div class="card" data-card-index="0">
      <span class="snippet">Loading reflections...</span>
    </div>
    <div class="card" data-card-index="1">
      <span class="snippet">Preparing thoughts...</span>
    </div>
    <div class="card" data-card-index="2">
      <span class="snippet">Gathering insights...</span>
    </div>
  </div>
  <button id="shuffle-btn" class="btn-primary">Shuffle Thoughts</button>
</section>
</div>

<!-- Information tooltips -->
<div class="information-tooltip" id="tip-themes" role="tooltip">
  Click into a theme to see reflections about overthinking
  <span class="information-tooltip__arrow" aria-hidden="true"></span>
</div>

<div class="information-tooltip" id="tip-themes-mobile" role="tooltip">
  Click into a theme to see reflections about overthinking
  <span class="information-tooltip__arrow" aria-hidden="true"></span>
</div>

  <!-- Critical scripts (needed for initial render) -->
  <script defer src="../scripts/shared.js"></script>
  <script defer src="../scripts/flower-renderer.js"></script>
  <script defer src="../scripts/home.js"></script>
  <script defer src="../scripts/shuffle.js"></script>

  <!-- Non-critical scripts (can load after page renders) -->
  <script async src="../scripts/modal.js"></script>
  <script async src="../scripts/mobile-header.js"></script>

  <!-- Information tooltip system -->
  <script type="module">
    import { InformationTooltip } from '../scripts/information-tooltip.js';
    InformationTooltip.init({
      triggerSelector: '.info-tip-trigger',
      mobileWidthEl: null, // Let CSS handle width constraints
      offset: 8,
      breakpoint: 1160
    });
  </script>
</body>
</html>
