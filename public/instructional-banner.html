<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instructional Banner Component</title>
    <!-- Favicons - PNG for modern browsers (sharper), ICO as fallback -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>

<!-- Mobile/Tablet Instructional Banner Component -->
<div id="instructional-banner"
     role="region"
     aria-live="polite"
     aria-label="Instruction for interacting with flowers"
     style="display: none;">
    <div class="banner-content">
        CLICK ON THE FLOWERS TO EXPLORE
    </div>
</div>

<style>
/* Instructional Banner Styles */
#instructional-banner {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px) scale(0.8);
    z-index: 9999;
    opacity: 0;

    /* Exact styling from .mg-tooltip */
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    will-change: backdrop-filter;
    isolation: isolate;
    border: 0.5px solid #F8F8FF;
    border-radius: 5px; /* Pill-shaped for banner */
    padding: 8px 16px;

    /* Exact typography from .mg-tooltip */
    font: 500 14px/1.4 "Satoshi-Medium", sans-serif;
    color: #101720;
    white-space: nowrap;
    user-select: none;

    /* Cursor indicates interactivity */
    cursor: pointer;

    /* Transition properties for animations */
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                opacity 0.4s ease-out;
}

/* Show state */
#instructional-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
}

/* Bounce animation keyframes */
@keyframes gentle-bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0) scale(1);
    }
    40% {
        transform: translateX(-50%) translateY(10px) scale(1);
    }
    60% {
        transform: translateX(-50%) translateY(5px) scale(1);
    }
}

/* Bounce animation class */
#instructional-banner.bounce {
    animation: gentle-bounce 2s ease-in-out infinite;
}

/* Dismiss animation */
#instructional-banner.dismissing {
    opacity: 0;
    transform: translateX(-50%) translateY(80px) scale(0.9);
    transition: transform 0.3s ease-in, opacity 0.3s ease-in;
}

/* Reduced motion support */
@media (prefers-reduced-motion: reduce) {
    #instructional-banner {
        transition: opacity 0.3s ease-out;
    }

    #instructional-banner.show {
        transform: translateX(-50%) translateY(0) scale(1);
    }

    #instructional-banner.bounce {
        animation: none;
    }

    @keyframes gentle-bounce {
        /* Disable bounce animation */
        0%, 100% {
            transform: translateX(-50%) translateY(0) scale(1);
        }
    }
}

/* Hide on larger screens */
@media (min-width: 1161px) {
    #instructional-banner {
        display: none !important;
    }
}
</style>

<script>
(function() {
    'use strict';

    const STORAGE_KEY = 'instructional_banner_shown';
    const SWIPE_THRESHOLD = 40; // pixels

    // Device and session detection
    function shouldShowBanner() {
        // Check if already shown this session
        if (sessionStorage.getItem(STORAGE_KEY)) {
            return false;
        }

        // Check screen width
        if (window.innerWidth > 1160) {
            return false;
        }

        // Check touch support
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (!hasTouch) {
            return false;
        }

        return true;
    }

    // Animation and interaction management
    class InstructionalBanner {
        constructor() {
            this.banner = document.getElementById('instructional-banner');
            this.isVisible = false;
            this.touchStartY = 0;
            this.isDismissing = false;

            this.init();
        }

        init() {
            if (!this.banner || !shouldShowBanner()) {
                return;
            }

            this.setupEventListeners();
            this.show();
        }

        setupEventListeners() {
            // Click to dismiss
            this.banner.addEventListener('click', () => this.dismiss());

            // Touch events for swipe detection
            this.banner.addEventListener('touchstart', (e) => {
                this.touchStartY = e.touches[0].clientY;
            }, { passive: true });

            this.banner.addEventListener('touchmove', (e) => {
                if (this.isDismissing) return;

                const touchY = e.touches[0].clientY;
                const deltaY = touchY - this.touchStartY;

                // Swipe down detection
                if (deltaY > SWIPE_THRESHOLD) {
                    this.dismiss();
                }
            }, { passive: true });

            // Keyboard accessibility (ESC to dismiss)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && this.isVisible && !this.isDismissing) {
                    this.dismiss();
                }
            });

            // Handle resize to hide/show appropriately
            window.addEventListener('resize', () => {
                if (window.innerWidth > 1160 && this.isVisible) {
                    this.hide();
                }
            });
        }

        show() {
            // Mark as shown in session storage immediately
            sessionStorage.setItem(STORAGE_KEY, 'true');

            // Show the banner
            this.banner.style.display = 'block';
            this.isVisible = true;

            // Delay entrance animation
            setTimeout(() => {
                this.banner.classList.add('show');

                // Add bounce animation if motion not reduced
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (!prefersReducedMotion) {
                    setTimeout(() => {
                        this.banner.classList.add('bounce');
                    }, 400); // Start bounce after entrance animation
                }
            }, 600);
        }

        dismiss() {
            if (this.isDismissing) return;

            this.isDismissing = true;
            this.banner.classList.remove('bounce');
            this.banner.classList.add('dismissing');

            // Hide after animation completes
            setTimeout(() => {
                this.hide();
            }, 300);
        }

        hide() {
            this.banner.style.display = 'none';
            this.isVisible = false;
            this.isDismissing = false;
            this.banner.classList.remove('show', 'bounce', 'dismissing');
        }
    }

    // Global helper for QA testing
    window.resetCoachmarkSession = function() {
        sessionStorage.removeItem(STORAGE_KEY);
        console.log('Instructional banner session reset. Reload the page to see the banner again.');
    };

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            new InstructionalBanner();
        });
    } else {
        new InstructionalBanner();
    }

})();
</script>

  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
