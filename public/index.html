  <!-- Critical CSS for immediate LCP rendering -->
  <style>
    /* Inline critical category grid CSS for faster LCP */
    #category-grid {
      display: grid;
      grid-template-columns: repeat(4, 288px);
      column-gap: clamp(40px, 6vw, 90px);
      row-gap: clamp(40px, 5vh, 72px);
      justify-content: center;
      justify-items: center;
      margin: 40px auto;
      max-width: 1400px;
    }

    .category-cell {
      position: relative;
      width: 288px;
      height: 198px;
      overflow: visible;
    }

    .category-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: "junicoderegularcondensed", "junicoderegular", Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      text-align: center;
      line-height: 1.2;
      color: #101720;
      letter-spacing: 0.1em;
      z-index: 2;
      cursor: pointer;
    }

    /* Mobile responsive for critical CSS */
    @media (max-width: 1160px) {
      #category-grid {
        grid-template-columns: repeat(2, 288px);
        column-gap: clamp(12px, 2vw, 20px);
        row-gap: clamp(40px, 5vh, 72px);
      }
    }

    @media (max-width: 775px) {
      #themes-desktop { display: none; }
    }

    /* Loading spinner for immediate user feedback */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #F8F8FF;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
      pointer-events: none; /* Let intro taps work while spinner shows */
    }

    .loader, .loader:before, .loader:after {
      border-radius: 50%;
      width: 2.5em;
      height: 2.5em;
      animation-fill-mode: both;
      animation: bblFadInOut 1.8s infinite ease-in-out;
    }
    .loader {
      color: #AFBCC7;
      font-size: 7px;
      position: relative;
      text-indent: -9999em;
      transform: translateZ(0);
      animation-delay: -0.16s;
    }
    .loader:before,
    .loader:after {
      content: '';
      position: absolute;
      top: 0;
    }
    .loader:before {
      left: -3.5em;
      animation-delay: -0.32s;
    }
    .loader:after {
      left: 3.5em;
    }

    @keyframes bblFadInOut {
      0%, 80%, 100% { box-shadow: 0 2.5em 0 -1.3em }
      40% { box-shadow: 0 2.5em 0 0 }
    }

    .page-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .loader, .loader:before, .loader:after {
        animation: none;
      }
      .page-loader {
        transition: none;
      }
    }
  </style>

  <!-- Critical scripts (loaded after LCP for better performance) -->
  <script>
    // Loading management with fallback
    let loaderHidden = false;
    let contentReady = false;

    function hideLoader() {
      if (loaderHidden) return;
      loaderHidden = true;

      const loader = document.querySelector('.page-loader');
      if (loader) {
        loader.classList.add('fade-out');
        // Remove from DOM after transition
        setTimeout(() => {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Fallback: hide loader after 5 seconds maximum (extended for full content loading)
    setTimeout(hideLoader, 5000);

    // Hide loader when fonts are loaded and content is visually ready
    function checkAndHideLoader() {
      if (contentReady && document.fonts.ready) {
        document.fonts.ready.then(() => {
          // Wait for structural content to be ready, then trigger flower animations
          setTimeout(() => {
            // Check if structural content is ready
            const categoryGrid = document.getElementById('category-grid');
            const shuffleCards = document.getElementById('shuffle-cards');

            // Wait for basic content structure to be populated
            if (categoryGrid && categoryGrid.children.length > 0 &&
                shuffleCards && shuffleCards.children.length > 0) {

              // Hide loader (flower animations will be triggered by intro completion)
              hideLoader();

              // Tooltips already initialized on DOMContentLoaded

            } else {
              // If content isn't ready yet, check again in a bit
              setTimeout(checkAndHideLoader, 200);
            }
          }, 300);
        });
      }
    }

    // Load critical scripts immediately but track when they're ready
    const scripts = [
      'scripts/shared.js',
      'scripts/flower-renderer.js',
      'scripts/home.js',
      'scripts/shuffle.js'
    ];

    let loadedScripts = 0;
    scripts.forEach((src) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => {
        loadedScripts++;
        // When all critical scripts are loaded, mark content as ready
        if (loadedScripts === scripts.length) {
          contentReady = true;
          // Tooltips already initialized separately
          checkAndHideLoader();
        }
      };
      document.head.appendChild(script);
    });

    // Also hide on DOMContentLoaded if scripts fail to load
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!loaderHidden) {
          contentReady = true;
          checkAndHideLoader();
        }
      }, 2500); // Extended to allow more time for content loading
    });
  </script>

  <!-- Information tooltip system -->
  <script type="module">
    import { InformationTooltip, createInfoTipSVG } from './scripts/information-tooltip.js';

    // Expose globally for use anywhere
    window.InformationTooltip = InformationTooltip;
    window.InformationTooltip.createInfoTipSVG = createInfoTipSVG;

    // Simple tooltip initialization - run once when module loads
    console.log('Initializing tooltips...');

    // Initialize tooltip system
    window._infoTips = InformationTooltip.init({
      triggerSelector: '.info-tip-trigger',
      mobileWidthEl: null, // Let CSS handle width constraints
      offset: 4,
      breakpoint: 1160
    });

    // Set up tooltips for existing buttons
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.info-tip-trigger[data-tip-text]').forEach(button => {
        const content = button.getAttribute('data-tip-text');
        if (content) {
          console.log('Setting up tooltip for button:', content);
          // Add SVG icon if not already there
          if (!button.innerHTML.includes('svg')) {
            button.innerHTML = createInfoTipSVG() + button.innerHTML;
          }

          // Create tooltip element manually and use the existing instance
          const tooltipId = `tooltip-${Math.random().toString(36).substr(2, 9)}`;
          const tooltip = document.createElement('div');
          tooltip.id = tooltipId;
          tooltip.className = 'information-tooltip';
          tooltip.setAttribute('role', 'tooltip');
          tooltip.innerHTML = `
            ${content}
            <span class="information-tooltip__arrow" aria-hidden="true"></span>
          `;

          // Append to body
          document.body.appendChild(tooltip);

          // Set aria relationship
          button.setAttribute('aria-describedby', tooltipId);

          // Use the existing instance to bind events
          window._infoTips.bindSingleTrigger(button);

          console.log('Tooltip created with ID:', tooltipId);
          console.log('Button aria-describedby:', button.getAttribute('aria-describedby'));
        }
      });
    });
  </script>
