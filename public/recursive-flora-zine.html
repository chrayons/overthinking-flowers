<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Flora Zine - Metaphor Garden</title>
  <link rel="preload" href="fonts/Junicode/junicode-regularcondensed-webfont.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Satoshi/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Satoshi/fonts/Satoshi-Light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="style" href="fonts/Satoshi/css/satoshi.css">
  <link rel="stylesheet" href="fonts/Satoshi/css/satoshi.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* PDF Reader Styles */
    .zine-container {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .pdf-reader {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pdf-canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      background: transparent;
      padding: 20px 20px 80px 20px; /* Extra bottom padding for fixed controls */
    }

    #pdf-canvas {
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 120px);
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .pdf-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font: 500 14px/1.4 "Satoshi-Medium", sans-serif;
      color: var(--text-primary);
      opacity: 0.7;
    }

    .pdf-controls {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      max-width: 800px;
      background: transparent;
      border-top: none;
      padding: 12px 20px 32px 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pdf-controls-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .pdf-progress-container {
      flex: 1;
      height: 2px;
      margin: 0 20px;
      position: relative;
    }

    .pdf-nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pdf-progress-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #e1e5e9;
    }

    .pdf-progress-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: #2259A1;
      width: var(--progress-width, 0%);
      transition: width 0.3s ease;
    }

    .pdf-nav-button {
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 47px;
      height: 47px;
    }

    .pdf-nav-button:hover:not(:disabled) {
      background: #f0f0f0;
    }

    .pdf-nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pdf-fullscreen-button {
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 47px;
      height: 47px;
    }

    .pdf-fullscreen-button:hover {
      background: #f0f0f0;
    }

    .pdf-page-info {
      font: 500 12px/1.4 "Satoshi-Medium", sans-serif;
      color: var(--text-primary);
      text-align: center;
      white-space: nowrap;
    }


    /* Responsive Design */
    @media (max-width: 768px) {
      .zine-container {
        height: 100vh;
        padding: 0;
      }

      .pdf-canvas-container {
        padding: 10px 10px 80px 10px;
      }

      #pdf-canvas {
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 120px);
      }

      .pdf-controls {
        padding: 8px 16px;
        min-height: 50px;
      }

      .pdf-controls {
        padding: 8px 16px 32px 16px;
        width: 85%; /* Slightly wider on mobile for usability */
      }

      .pdf-progress-container {
        margin: 0 12px;
      }

      .pdf-nav-right {
        gap: 12px;
      }

      .pdf-nav-button {
        padding: 8px;
        width: 40px;
        height: 40px;
      }

      .pdf-page-info {
        font-size: 11px;
      }

      .pdf-fullscreen-button {
        padding: 8px;
        font-size: 14px;
        width: 40px;
        height: 40px;
      }
    }

    /* Error State */
    .pdf-error {
      text-align: center;
      padding: 2rem;
      color: #dc3545;
      font: 500 14px/1.4 "Satoshi-Medium", sans-serif;
    }

    /* Fullscreen Mode */
    .pdf-reader.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--page-bg);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    /* Hide headers in fullscreen */
    .pdf-reader.fullscreen ~ .header-bar,
    .pdf-reader.fullscreen ~ .mobile-header-dropdown {
      display: none;
    }

    body:has(.pdf-reader.fullscreen) .header-bar,
    body:has(.pdf-reader.fullscreen) .mobile-header-dropdown {
      display: none;
    }

    /* Mobile Landscape Fullscreen */
    @media (max-width: 768px) {
      .pdf-reader.fullscreen {
        transform-origin: center center;
        animation: rotateToLandscape 0.3s ease-out forwards;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      @keyframes rotateToLandscape {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
          width: 100vw;
          height: 100vh;
        }
        to {
          transform: translate(-50%, -50%) rotate(90deg);
          width: 100vh;
          height: 100vw;
        }
      }

      .pdf-reader.fullscreen.exiting {
        animation: rotateToPortrait 0.3s ease-out forwards;
      }

      @keyframes rotateToPortrait {
        from {
          transform: translate(-50%, -50%) rotate(90deg);
          width: 100vh;
          height: 100vw;
        }
        to {
          transform: translate(-50%, -50%) rotate(0deg);
          width: 100vw;
          height: 100vh;
        }
      }
    }

    .pdf-reader.fullscreen .pdf-canvas-container {
      flex: 1;
      min-height: auto;
      padding: 1rem;
    }

    .pdf-reader.fullscreen #pdf-canvas {
      max-height: calc(100vh - 80px); /* Account for simplified controls */
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .pdf-reader.fullscreen #pdf-canvas {
        max-height: calc(100vw - 80px); /* Landscape dimensions */
        max-width: 100vh;
      }
    }

    .pdf-reader.fullscreen .pdf-controls {
      background: transparent;
      border-top: none;
      padding: 12px 20px 32px 20px;
      margin-top: 0;
      box-shadow: none;
      transition: opacity 0.3s ease;
      z-index: 1000001; /* Above touch zones */
      pointer-events: auto; /* Ensure controls are clickable */
    }

    /* Auto-hide controls on mobile fullscreen */
    @media (max-width: 768px) {
      .pdf-reader.fullscreen .pdf-controls.auto-hidden {
        opacity: 0;
        pointer-events: none;
      }
    }


    /* Header styling for zine page */
    .header-link {
      color: #AFBCC7 !important; /* Light grey for METAPHOR GARDEN */
      font-family: "Satoshi-Light", system-ui !important;
      font-weight: 300 !important;
      transition: color 0.3s ease;
      text-decoration: none !important;
    }

    .header-link:hover {
      color: #2259A1 !important; /* Blue on hover */
    }

    .header-label {
      color: #2259A1 !important; /* Blue for RECURSIVE FLORA ZINE */
      font-family: "Satoshi-Medium", system-ui !important;
      font-weight: 500 !important;
      text-decoration: none;
    }

    .mobile-header-menu-item {
      color: #AFBCC7 !important; /* Light grey for mobile METAPHOR GARDEN */
      font-family: "Satoshi-Light", system-ui !important;
      transition: color 0.3s ease;
    }

    .mobile-header-menu-item:hover {
      color: #2259A1 !important; /* Blue on hover */
    }

    .mobile-header-menu-item.secondary {
      color: #2259A1 !important; /* Blue for mobile RECURSIVE FLORA ZINE */
      font-family: "Satoshi-Medium", system-ui !important;
      font-weight: 500 !important;
    }

    /* Very small screens */
    @media (max-width: 480px) {
      .pdf-controls {
        padding: 6px 12px 32px 12px;
        width: 90%; /* Even wider on very small screens */
      }

      .pdf-progress-container {
        margin: 0 8px;
      }

      .pdf-nav-right {
        gap: 8px;
      }

      .pdf-page-info {
        font-size: 10px;
      }

      .pdf-nav-button {
        padding: 6px;
        width: 36px;
        height: 36px;
      }

      .pdf-fullscreen-button {
        padding: 6px;
        width: 36px;
        height: 36px;
      }
    }

    /* Fix mobile header spacing on zine page */
    @media (max-width: 400px) {
      .mobile-header-toggle {
        top: 20px !important;
        right: 20px !important;
      }
      .mobile-header-menu {
        padding: 64px 20px 20px !important;
      }
      .zine-container {
        height: calc(100vh - 60px) !important;
        margin-top: 60px !important; /* Account for mobile header */
        padding-bottom: 0 !important; /* Fixed controls handle spacing */
      }
    }
  </style>
</head>
<body class="zine-page">
  <!-- Full-width header bar -->
  <header class="header-bar">
    <a href="index.html" class="header-link">METAPHOR GARDEN</a>
    <div class="header-label">RECURSIVE FLORA ZINE</div>
  </header>

  <!-- Mobile Header Dropdown (shows on very small screens) -->
  <div class="mobile-header-dropdown">
    <button class="mobile-header-toggle" aria-label="Menu" aria-expanded="false">
      <div class="menu-icon-inner">
        <span></span>
        <span></span>

    <nav class="mobile-header-menu">
      <a href="index.html" class="mobile-header-menu-item">METAPHOR GARDEN</a>
      <span class="mobile-header-menu-item secondary">RECURSIVE FLORA ZINE</span>
    </nav>
  </div>

  <div class="wrapper">

    <div class="zine-container">

      <div class="pdf-reader">
        <div class="pdf-canvas-container">
          <canvas id="pdf-canvas"></canvas>
          <div class="pdf-loading" id="pdf-loading">
            <div>Loading zine...</div>
            <div id="loading-progress" style="margin-top: 8px; font-size: 12px; opacity: 0.7;"></div>
          </div>
          <div class="pdf-error" id="pdf-error" style="display: none;">
            Error loading PDF. Please check that the file exists and try again.
          </div>
        </div>

        <div class="pdf-controls">
          <div class="pdf-controls-top">
            <button class="pdf-nav-button" id="prev-page" disabled>
              <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.4219 15.8438L8.20312 11.625L12.4219 7.40625" stroke="currentColor" stroke-width="1.40625" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="pdf-progress-container"></div>
            <div class="pdf-nav-right">
              <button class="pdf-nav-button" id="next-page" disabled>
                <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M10.5781 6.65625L14.7969 10.875L10.5781 15.0937" stroke="currentColor" stroke-width="1.40625" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button class="pdf-fullscreen-button" id="fullscreen-btn" title="Fullscreen">⛶</button>
            </div>
          </div>
          <div class="pdf-page-info">
            <span><span id="current-page">1</span> of <span id="page-count">-</span></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // PDF Reader Implementation
    class PDFReader {
      constructor() {
        this.pdfDoc = null;
        this.pageNum = 1;
        this.pageCount = 0;
        this.scale = 0.75;
        this.canvas = document.getElementById('pdf-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.isRendering = false;

        // PDF path - update this to your actual PDF file
        this.pdfPath = 'pdf/recursive-flora-zine.pdf';

        this.initializeElements();
        this.setupEventListeners();
        this.setupTouchNavigation();
        this.loadPDF();
      }

      initializeElements() {
        this.loadingEl = document.getElementById('pdf-loading');
        this.errorEl = document.getElementById('pdf-error');
        this.prevBtn = document.getElementById('prev-page');
        this.nextBtn = document.getElementById('next-page');
        this.currentPageEl = document.getElementById('current-page');
        this.pageCountEl = document.getElementById('page-count');
        this.fullscreenBtn = document.getElementById('fullscreen-btn');
        this.pdfReader = document.querySelector('.pdf-reader');
        this.controlsEl = document.querySelector('.pdf-controls');
      }

      setupEventListeners() {
        // Navigation buttons
        this.prevBtn.addEventListener('click', () => this.goToPrevPage());
        this.nextBtn.addEventListener('click', () => this.goToNextPage());


        // Fullscreen control
        this.fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT') return;

          switch(e.key) {
            case 'ArrowLeft':
              e.preventDefault();
              this.goToPrevPage();
              break;
            case 'ArrowRight':
              e.preventDefault();
              this.goToNextPage();
              break;
            case 'f':
            case 'F':
              e.preventDefault();
              this.toggleFullscreen();
              break;
            case 'Escape':
              e.preventDefault();
              this.exitFullscreen();
              break;
          }
        });

        // Handle fullscreen changes (when user exits via ESC or browser controls)
        document.addEventListener('fullscreenchange', () => this.handleFullscreenChange());
        document.addEventListener('webkitfullscreenchange', () => this.handleFullscreenChange());
        document.addEventListener('msfullscreenchange', () => this.handleFullscreenChange());
      }

      async loadPDF() {
        try {
          this.showLoading(true);

          // Configure PDF.js worker
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

          const loadingTask = pdfjsLib.getDocument(this.pdfPath);

          // Show download progress
          loadingTask.onProgress = (progress) => {
            if (progress.total) {
              const percent = Math.round((progress.loaded / progress.total) * 100);
              const progressEl = document.getElementById('loading-progress');
              if (progressEl) {
                progressEl.textContent = `Downloaded: ${percent}% (${(progress.loaded / 1024 / 1024).toFixed(1)}MB / ${(progress.total / 1024 / 1024).toFixed(1)}MB)`;
              }
            }
          };

          this.pdfDoc = await loadingTask.promise;
          this.pageCount = this.pdfDoc.numPages;
          this.pageCountEl.textContent = this.pageCount;

          this.showLoading(false);
          this.renderPage(1);
          this.updateControls();

        } catch (error) {
          console.error('Error loading PDF:', error);
          this.showError('Failed to load PDF. Please check the file path.');
        }
      }

      async renderPage(pageNum) {
        if (this.isRendering) return;

        this.isRendering = true;

        try {
          const page = await this.pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: this.scale });

          this.canvas.height = viewport.height;
          this.canvas.width = viewport.width;

          const renderContext = {
            canvasContext: this.ctx,
            viewport: viewport
          };

          await page.render(renderContext).promise;
          this.pageNum = pageNum;
          this.updateControls();

        } catch (error) {
          console.error('Error rendering page:', error);
          this.showError('Error rendering page ' + pageNum);
        }

        this.isRendering = false;
      }

      goToPage(pageNum) {
        if (pageNum >= 1 && pageNum <= this.pageCount && pageNum !== this.pageNum) {
          this.renderPage(pageNum);
        }
      }

      goToPrevPage() {
        if (this.pageNum > 1) {
          this.goToPage(this.pageNum - 1);
        }
      }

      goToNextPage() {
        if (this.pageNum < this.pageCount) {
          this.goToPage(this.pageNum + 1);
        }
      }


      updateControls() {
        this.prevBtn.disabled = this.pageNum <= 1;
        this.nextBtn.disabled = this.pageNum >= this.pageCount;
        this.currentPageEl.textContent = this.pageNum;

        // Update progress indicator
        const progress = (this.pageNum / this.pageCount) * 100;
        this.controlsEl.style.setProperty('--progress-width', `${progress}%`);
      }


      showLoading(show) {
        this.loadingEl.style.display = show ? 'block' : 'none';
        this.canvas.style.display = show ? 'none' : 'block';
      }

      showError(message) {
        this.loadingEl.style.display = 'none';
        this.canvas.style.display = 'none';
        this.errorEl.style.display = 'block';
        this.errorEl.textContent = message;
      }

      toggleFullscreen() {
        if (this.pdfReader.classList.contains('fullscreen')) {
          this.exitFullscreen();
        } else {
          this.enterFullscreen();
        }
      }

      enterFullscreen() {
        const isMobile = window.innerWidth <= 768;

        this.pdfReader.classList.add('fullscreen');
        this.fullscreenBtn.textContent = '⛉'; // Exit fullscreen icon
        this.fullscreenBtn.title = 'Exit Fullscreen';

        if (isMobile) {
          // On mobile, show instruction and rotate interface
          this.showMobileLandscapeHint();
          // Re-render after animation completes
          setTimeout(() => {
            this.renderPage(this.pageNum);
            this.startMobileFullscreenMode();
          }, 300);
        } else {
          // Desktop: try browser fullscreen
          if (this.pdfReader.requestFullscreen) {
            this.pdfReader.requestFullscreen();
          } else if (this.pdfReader.webkitRequestFullscreen) {
            this.pdfReader.webkitRequestFullscreen();
          } else if (this.pdfReader.msRequestFullscreen) {
            this.pdfReader.msRequestFullscreen();
          }
          this.renderPage(this.pageNum);
        }
      }

      exitFullscreen() {
        const isMobile = window.innerWidth <= 768;

        if (isMobile) {
          // Add exiting class for reverse animation
          this.pdfReader.classList.add('exiting');
          this.hideMobileLandscapeHint();
          this.stopMobileFullscreenMode();

          // Remove classes after animation
          setTimeout(() => {
            this.pdfReader.classList.remove('fullscreen', 'exiting');
            this.renderPage(this.pageNum);
          }, 300);
        } else {
          this.pdfReader.classList.remove('fullscreen');

          // Exit browser fullscreen
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }

          this.renderPage(this.pageNum);
        }

        this.fullscreenBtn.textContent = '⛶'; // Enter fullscreen icon
        this.fullscreenBtn.title = 'Fullscreen';
      }

      handleFullscreenChange() {
        // Check if we're no longer in browser fullscreen
        const isInFullscreen = document.fullscreenElement ||
                              document.webkitFullscreenElement ||
                              document.msFullscreenElement;

        if (!isInFullscreen && this.pdfReader.classList.contains('fullscreen')) {
          // User exited fullscreen via ESC or browser controls, update our state
          this.pdfReader.classList.remove('fullscreen');
          this.fullscreenBtn.textContent = '⛶'; // Enter fullscreen icon
          this.fullscreenBtn.title = 'Fullscreen';
          this.renderPage(this.pageNum);
        }
      }

      showMobileLandscapeHint() {
        // Create a hint overlay for mobile users
        const hint = document.createElement('div');
        hint.id = 'mobile-landscape-hint';
        hint.innerHTML = `
          <div style="
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            will-change: backdrop-filter;
            isolation: isolate;
            border: 0.5px solid #F8F8FF;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            font: 500 14px/1.4 'Satoshi-Medium', sans-serif;
            color: var(--text-primary);
            z-index: 1000000;
            max-width: 280px;
            pointer-events: auto;
          ">
            <div style="margin-bottom: 8px; display: flex; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="32" height="40" style="fill: var(--text-primary);">
                <g data-name="Rotate Phone">
                  <path d="M59.9585,28.6123a.99993.99993,0,0,1-1.98829.21485A22.95616,22.95616,0,0,0,42.86005,9.6864L44.646,13.03271a1,1,0,0,1-1.76465.94141L40.2085,8.96631a1.45193,1.45193,0,0,1,.59765-1.97168L45.72754,4.396a1,1,0,0,1,.93359,1.76855L43.54456,7.81036A24.97223,24.97223,0,0,1,59.9585,28.6123Z"/>
                  <path d="M23.19385,57.00537,18.27246,59.604a1,1,0,0,1-.93359-1.76855l3.11657-1.64581A24.97223,24.97223,0,0,1,4.0415,35.3877a1,1,0,0,1,1.98829-.21485A22.95616,22.95616,0,0,0,21.14,54.3136L19.354,50.96729a1.00007,1.00007,0,0,1,1.76465-.94141l2.67285,5.00781A1.45193,1.45193,0,0,1,23.19385,57.00537Z"/>
                  <path d="M37.041,57.61523,6.38477,26.959a3.71386,3.71386,0,0,1,0-5.24609L21.71289,6.38477a3.71386,3.71386,0,0,1,5.24609,0L57.61523,37.041a3.71386,3.71386,0,0,1,0,5.24609L42.28711,57.61523A3.71325,3.71325,0,0,1,37.041,57.61523ZM23.127,7.79883,7.79883,23.127a1.71193,1.71193,0,0,0,0,2.418L38.45508,56.20117a1.71282,1.71282,0,0,0,2.418,0L56.20117,40.87305a1.71193,1.71193,0,0,0,0-2.418L25.54492,7.79883A1.71277,1.71277,0,0,0,23.127,7.79883Z"/>
                  <path d="M14.6875,18.51953l3.832-3.832a.99992.99992,0,0,1,1.41406,1.41406l-3.832,3.832A.99991.99991,0,0,1,14.6875,18.51953Z"/>
                  <path d="M43.42773,47.39648a2.80633,2.80633,0,1,1,3.96875,0A2.80943,2.80943,0,0,1,43.42773,47.39648ZM44.8418,44.8418a.80654.80654,0,1,0,1.14062,0A.80747.80747,0,0,0,44.8418,44.8418Z"/>
                </g>
              </svg>
            </div>
            <div style="color: var(--text-primary);">Rotate your device to landscape for better reading</div>
            <div style="font-size: 12px; margin-top: 8px; opacity: 0.7; color: var(--text-primary);">Tap anywhere to continue</div>
          </div>
        `;

        // Remove hint on tap
        hint.addEventListener('click', () => {
          this.hideMobileLandscapeHint();
        });

        document.body.appendChild(hint);

        // Auto-hide after 4 seconds
        setTimeout(() => {
          this.hideMobileLandscapeHint();
        }, 4000);
      }

      hideMobileLandscapeHint() {
        const hint = document.getElementById('mobile-landscape-hint');
        if (hint) {
          hint.remove();
        }
      }

      startMobileFullscreenMode() {
        // Auto-hide controls after 2 seconds
        this.mobileFullscreenTimeout = setTimeout(() => {
          this.controlsEl.classList.add('auto-hidden');
        }, 2000);

        // Set up mobile fullscreen touch handling
        this.setupMobileFullscreenTouch();
      }

      stopMobileFullscreenMode() {
        if (this.mobileFullscreenTimeout) {
          clearTimeout(this.mobileFullscreenTimeout);
        }
        this.controlsEl.classList.remove('auto-hidden');
        this.removeMobileFullscreenTouch();
      }

      showMobileControls() {
        this.controlsEl.classList.remove('auto-hidden');

        // Reset the auto-hide timer
        if (this.mobileFullscreenTimeout) {
          clearTimeout(this.mobileFullscreenTimeout);
        }
        this.mobileFullscreenTimeout = setTimeout(() => {
          this.controlsEl.classList.add('auto-hidden');
        }, 3000); // 3 seconds after showing
      }

      setupMobileFullscreenTouch() {
        this.mobileFullscreenHandler = (e) => {
          // Check if touch is on control elements - if so, don't handle it
          const target = e.target;
          if (target.closest('.pdf-controls')) {
            return;
          }

          e.preventDefault();
          e.stopPropagation();

          const rect = this.canvas.getBoundingClientRect();
          const touch = e.changedTouches ? e.changedTouches[0] : e;

          // Get touch position relative to the canvas
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;

          const canvasWidth = rect.width;
          const canvasHeight = rect.height;

          // For 90-degree rotated view, flip the zones:
          // Navigation zones: top and bottom become left and right in rotated space
          const topZone = canvasHeight * 0.3;     // Top 30% = left side in landscape = previous page
          const bottomZone = canvasHeight * 0.7;  // Bottom 30% = right side in landscape = next page

          // Control zones: center spine (horizontal in rotated view) or right edge
          const centerSpineTop = canvasHeight * 0.45;   // Center spine area (horizontal)
          const centerSpineBottom = canvasHeight * 0.55;
          const rightEdge = canvasWidth * 0.9;          // Right 10% of screen

          // Check for controls first (center spine or right edge)
          const isInCenterSpine = (y >= centerSpineTop && y <= centerSpineBottom);
          const isInRightEdge = (x >= rightEdge);

          if (isInCenterSpine || isInRightEdge) {
            this.showMobileControls();
            return;
          }

          // Navigation based on vertical position (which becomes left/right in rotated view)
          if (y < topZone) {
            // Top 30% = left side in landscape = previous page
            this.goToPrevPage();
          } else if (y > bottomZone) {
            // Bottom 30% = right side in landscape = next page
            this.goToNextPage();
          }
          // Middle area that's not center spine = do nothing
        };

        // Add to canvas only, but exclude control areas
        this.canvas.addEventListener('touchend', this.mobileFullscreenHandler, { passive: false });
        this.canvas.addEventListener('click', this.mobileFullscreenHandler, { passive: false });

        // Don't add to pdfReader to avoid intercepting control clicks
      }

      removeMobileFullscreenTouch() {
        if (this.mobileFullscreenHandler) {
          this.canvas.removeEventListener('touchend', this.mobileFullscreenHandler);
          this.canvas.removeEventListener('click', this.mobileFullscreenHandler);
        }
      }

      setupTouchNavigation() {
        this.normalTouchHandler = (e) => {
          // Skip if in mobile fullscreen mode
          if (this.pdfReader.classList.contains('fullscreen') && window.innerWidth <= 768) {
            return;
          }

          const rect = this.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const canvasWidth = rect.width;

          // Divide canvas into thirds
          const leftThird = canvasWidth / 3;
          const rightThird = canvasWidth * 2 / 3;

          if (x < leftThird) {
            // Left third - previous page
            this.goToPrevPage();
          } else if (x > rightThird) {
            // Right third - next page
            this.goToNextPage();
          }
          // Middle third - do nothing (allows for other interactions)
        };

        this.normalTouchEndHandler = (e) => {
          // Skip if in mobile fullscreen mode
          if (this.pdfReader.classList.contains('fullscreen') && window.innerWidth <= 768) {
            return;
          }

          e.preventDefault(); // Prevent double-firing with click

          const touch = e.changedTouches[0];
          const rect = this.canvas.getBoundingClientRect();
          const x = touch.clientX - rect.left;
          const canvasWidth = rect.width;

          // Divide canvas into thirds
          const leftThird = canvasWidth / 3;
          const rightThird = canvasWidth * 2 / 3;

          if (x < leftThird) {
            // Left third - previous page
            this.goToPrevPage();
          } else if (x > rightThird) {
            // Right third - next page
            this.goToNextPage();
          }
        };

        this.canvas.addEventListener('click', this.normalTouchHandler);
        this.canvas.addEventListener('touchend', this.normalTouchEndHandler);
      }
    }

    // Initialize PDF Reader when page loads
    document.addEventListener('DOMContentLoaded', () => {
      new PDFReader();
    });
  </script>

  <!-- Mobile header functionality -->
  <script async src="scripts/mobile-header.js"></script>

  <!-- Adaptive header system -->
  <script defer src="scripts/adaptive-header.js"></script>
